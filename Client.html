  function callApi(action, data) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler((response) => {
          if (response && response.ok) {
            resolve(response.data);
          } else {
            reject(new Error(response && response.error ? response.error.message : 'เกิดข้อผิดพลาดจากระบบ'));
          }
        })
        .withFailureHandler(reject)
        .api(action, data || {});
    });
  }

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  // Only http(s) links are rendered; anything else (e.g. javascript:) becomes a dead link.
  function safeUrl(value) {
    const url = String(value || '').trim();
    return /^https?:\/\//i.test(url) ? escapeHtml(url) : '#';
  }

  const EMAIL_PATTERN = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  function splitEmails(text) {
    return String(text || '').split(/[\s,;]+/).map((item) => item.trim().toLowerCase()).filter(Boolean);
  }

  function parseAttendees(value) {
    return Array.isArray(value) ? value.slice() : splitEmails(value);
  }

  function createAttendeeEditor(options) {
    let emails = [];

    function showError(message) {
      options.error.textContent = message || '';
      options.error.hidden = !message;
    }

    function render() {
      options.list.innerHTML = emails.map((email) => `
        <li class="attendee-chip"><span>${escapeHtml(email)}</span><button type="button" class="attendee-remove" data-email="${escapeHtml(email)}" aria-label="ลบ ${escapeHtml(email)}" title="ลบ">×</button></li>
      `).join('');
      const max = options.getMax();
      options.counter.textContent = emails.length
        ? `ผู้ร่วมจัด ${emails.length} / ${max} อีเมล`
        : `ยังไม่ได้ใส่อีเมล (ต้องใส่อย่างน้อย 1 คน สูงสุด ${max} คน)`;
      options.counter.classList.toggle('is-full', emails.length >= max);
    }

    function add(text) {
      const result = { added: [], invalid: [], duplicates: [], overLimit: [] };
      const alreadyInvited = (options.getAlreadyInvited ? options.getAlreadyInvited() : []).map((email) => String(email || '').trim().toLowerCase());
      splitEmails(text).forEach((email) => {
        if (email.length > 254 || !EMAIL_PATTERN.test(email)) result.invalid.push(email);
        else if (emails.includes(email) || alreadyInvited.includes(email) || result.added.includes(email)) result.duplicates.push(email);
        else if (emails.length >= options.getMax()) result.overLimit.push(email);
        else {
          emails.push(email);
          result.added.push(email);
        }
      });
      render();
      return result;
    }

    function addFromInput(rawText) {
      const text = rawText === undefined ? options.input.value : rawText;
      if (!text.trim()) {
        showError('');
        return { added: [], invalid: [], duplicates: [], overLimit: [] };
      }
      const result = add(text);
      const messages = [];
      if (result.invalid.length) messages.push(`อีเมลไม่ถูกต้อง: ${result.invalid.join(', ')}`);
      if (result.overLimit.length) messages.push(`เพิ่มได้สูงสุด ${options.getMax()} อีเมล (เกิน: ${result.overLimit.join(', ')})`);
      if (result.duplicates.length) messages.push(`มีในรายชื่อแล้วหรือได้รับเชิญอยู่แล้ว: ${result.duplicates.join(', ')}`);
      showError(messages.join('\n'));
      // Keep what could not be added in the box so the user can fix it.
      options.input.value = result.invalid.concat(result.overLimit).join(', ');
      return result;
    }

    function set(list) {
      emails = [];
      showError('');
      options.input.value = '';
      add(parseAttendees(list).join(' '));
    }

    options.addButton.addEventListener('click', () => {
      addFromInput();
      options.input.focus();
    });
    options.input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ',' || event.key === ';') {
        event.preventDefault();
        addFromInput();
      }
    });
    // Read the clipboard directly: single-line inputs drop line breaks, which would glue
    // a pasted column of emails (e.g. from Excel) into one invalid address.
    options.input.addEventListener('paste', (event) => {
      const pasted = event.clipboardData ? event.clipboardData.getData('text') : '';
      if (pasted && splitEmails(pasted).length > 1) {
        event.preventDefault();
        addFromInput(`${options.input.value} ${pasted}`);
        return;
      }
      window.setTimeout(() => {
        if (splitEmails(options.input.value).length > 1) addFromInput();
      }, 0);
    });
    options.list.addEventListener('click', (event) => {
      const button = event.target.closest('.attendee-remove');
      if (!button) return;
      emails = emails.filter((email) => email !== button.dataset.email);
      showError('');
      render();
    });

    render();
    return {
      addFromInput,
      set,
      get: () => emails.slice(),
      clear: () => set([]),
      render
    };
  }

  function pad2(value) {
    return String(value).padStart(2, '0');
  }

  function formatDateInput(date) {
    return `${date.getFullYear()}-${pad2(date.getMonth() + 1)}-${pad2(date.getDate())}`;
  }

  function formatDisplayDate(date) {
    return `${pad2(date.getDate())}/${pad2(date.getMonth() + 1)}/${date.getFullYear()}`;
  }

  function formatDisplayDateValue(dateValue) {
    const dateMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateValue || '').trim());
    if (!dateMatch) return '';
    return `${dateMatch[3]}/${dateMatch[2]}/${dateMatch[1]}`;
  }

  function formatTimeInput(date) {
    return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
  }

  function populateTimeSelect(select, selectedValue) {
    const currentValue = selectedValue || select.value;
    const options = [];
    for (let hour = 0; hour < 24; hour += 1) {
      for (let minute = 0; minute < 60; minute += 15) {
        const value = `${pad2(hour)}:${pad2(minute)}`;
        options.push(`<option value="${value}">${value}</option>`);
      }
    }
    select.innerHTML = options.join('');
    if (currentValue) select.value = currentValue;
  }

  function syncDateDisplay(dateInput) {
    const display = document.querySelector(`[data-date-display-for="${dateInput.id}"]`);
    if (display) display.value = formatDisplayDateValue(dateInput.value);
  }

  function syncAllDateDisplays() {
    document.querySelectorAll('.native-date-input').forEach(syncDateDisplay);
  }

  function valueToDate(dateValue) {
    const dateMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateValue || '').trim());
    if (!dateMatch) return null;
    return new Date(Number(dateMatch[1]), Number(dateMatch[2]) - 1, Number(dateMatch[3]), 12, 0, 0, 0);
  }

  function sameDate(first, second) {
    return first && second &&
      first.getFullYear() === second.getFullYear() &&
      first.getMonth() === second.getMonth() &&
      first.getDate() === second.getDate();
  }

  function closeDatePicker() {

  function setDatePickerValue(date) {
    if (!state.activeDateInput) return;
    state.activeDateInput.value = formatDateInput(date);
    syncDateDisplay(state.activeDateInput);
    state.activeDateInput.dispatchEvent(new Event('change', { bubbles: true }));
    closeDatePicker();
  }

  function renderDatePicker() {
    const monthDate = state.datePickerMonth;
    const year = monthDate.getFullYear();
    const month = monthDate.getMonth();
    const selectedDate = state.activeDateInput ? valueToDate(state.activeDateInput.value) : null;
    const today = new Date();
    const monthNames = [
      'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
      'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
    ];
    const firstDay = new Date(year, month, 1);
    const firstGridOffset = (firstDay.getDay() + 6) % 7;
    const gridStart = new Date(year, month, 1 - firstGridOffset);
    const days = [];

    datePickerTitle.textContent = `${monthNames[month]} ${year}`;
    for (let index = 0; index < 42; index += 1) {
      const date = new Date(gridStart);
      date.setDate(gridStart.getDate() + index);
      const isOutside = date.getMonth() !== month;
      const classes = [
        'date-picker-day',
        isOutside ? 'outside' : '',
        sameDate(date, today) ? 'today' : '',
        sameDate(date, selectedDate) ? 'selected' : ''
      ].filter(Boolean).join(' ');
      days.push(`<button type="button" class="${classes}" data-date="${formatDateInput(date)}">${date.getDate()}</button>`);
    }
    datePickerGrid.innerHTML = days.join('');
  }

  function openDatePicker(inputId) {
    const input = document.getElementById(inputId);
    if (!input) return;
    const selectedDate = valueToDate(input.value) || new Date();
    state.activeDateInput = input;
    state.datePickerMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);
    renderDatePicker();
    datePickerModal.hidden = false;
  }

  function parseDateOnly(dateText, label, endOfDay) {
    if (!dateText) return null;
    const dateMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateText || '').trim());
    if (!dateMatch) {
      throw new Error(`${label}: กรุณาเลือกวันที่จากปฏิทิน`);
    }
    const year = Number(dateMatch[1]);
    const month = Number(dateMatch[2]);
    const day = Number(dateMatch[3]);
    const parsed = new Date(year, month - 1, day, endOfDay ? 23 : 0, endOfDay ? 59 : 0, endOfDay ? 59 : 0, 0);
    if (parsed.getFullYear() !== year || parsed.getMonth() !== month - 1 || parsed.getDate() !== day) {
      throw new Error(`${label}: วันที่ไม่ถูกต้อง`);
    }
    return parsed;
  }

  function parseThaiDateTime(dateText, timeText, label) {
    const dateMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateText || '').trim());
    const timeMatch = /^([01]\d|2[0-3]):([0-5]\d)$/.exec(String(timeText || '').trim());

    if (!dateMatch) throw new Error(`${label}: กรุณาเลือกวันที่จากปฏิทิน`);
    if (!timeMatch) throw new Error(`${label}: กรุณาเลือกเวลาแบบ 24 ชั่วโมง เช่น 09:30 หรือ 14:00`);

    const year = Number(dateMatch[1]);
    const month = Number(dateMatch[2]);
    const day = Number(dateMatch[3]);
    const hour = Number(timeMatch[1]);
    const minute = Number(timeMatch[2]);
    const parsed = new Date(year, month - 1, day, hour, minute, 0, 0);

    if (
      parsed.getFullYear() !== year ||
      parsed.getMonth() !== month - 1 ||
      parsed.getDate() !== day ||
      parsed.getHours() !== hour ||
      parsed.getMinutes() !== minute
    ) {
      throw new Error(`${label}: วันที่หรือเวลาไม่ถูกต้อง`);
    }

    return parsed;
  }

  function formatDateTime(value) {
    if (!value) return '-';
    const date = new Date(value);
    return `${formatDisplayDate(date)} ${formatTimeInput(date)} น.`;
  }

  function formatDayKey(value) {
    return formatDisplayDate(new Date(value));
  }

  function setDefaultTimes() {
    populateTimeSelect(form.elements.startClock);
    populateTimeSelect(form.elements.endClock);
    const start = new Date();
    start.setMinutes(start.getMinutes() < 30 ? 30 : 60, 0, 0);
    const end = new Date(start.getTime() + 60 * 60 * 1000);
    form.elements.startDate.value = formatDateInput(start);
    form.elements.startClock.value = formatTimeInput(start);
    form.elements.endDate.value = formatDateInput(end);
    form.elements.endClock.value = formatTimeInput(end);
    syncAllDateDisplays();
  }

  function buildBookingPayload() {
    const data = Object.fromEntries(new FormData(form).entries());
    const missing = [];
    if (!data.meetingType) missing.push('รูปแบบประชุม');
    if (!data.roomId) missing.push('ห้องประชุม / ทรัพยากร');
    if (!data.title) missing.push('หัวข้อประชุม');
    if (!data.requesterName) missing.push('ชื่อผู้จอง');
    if (!data.department) missing.push('ฝ่าย');
    if (!data.startDate) missing.push('วันที่เริ่ม');
    if (!data.startClock) missing.push('เวลาเริ่ม');
    if (!data.endDate) missing.push('วันที่สิ้นสุด');
    if (!data.endClock) missing.push('เวลาสิ้นสุด');
    if (missing.length) throw new Error(`กรุณากรอกข้อมูลที่บังคับ: ${missing.join(', ')}`);
    if (data.requesterEmail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.requesterEmail)) {
      throw new Error('อีเมลผู้จองไม่ถูกต้อง ถ้าไม่ต้องการใส่อีเมลให้เว้นว่างไว้');
    }
    if (data.meetingType === 'OFFSITE' && data.gpsUrl && !/^https?:\/\/[^\s"'<>]+$/i.test(data.gpsUrl.trim())) {
      throw new Error('ลิงก์ GPS ต้องขึ้นต้นด้วย http:// หรือ https:// และห้ามมีช่องว่างหรือเครื่องหมายคำพูด');
    }
    if (data.meetingType === 'ONLINE') {
      const pending = bookingAttendees.addFromInput();
      if (pending.invalid.length || pending.overLimit.length) {
        throw new Error(`กรุณาตรวจอีเมลผู้ร่วมจัด: ${pending.invalid.concat(pending.overLimit).join(', ')}`);
      }
      if (!bookingAttendees.get().length) throw new Error('กรุณาใส่อีเมลอย่างน้อย 1 คน (ใส่อีเมลตัวเองก็ได้) เพื่อให้มีคนเปิดห้องและอัดวิดีโอการประชุมได้');
      data.attendeeEmails = bookingAttendees.get();
    }
    const start = parseThaiDateTime(data.startDate, data.startClock, 'เวลาเริ่ม');
    const end = parseThaiDateTime(data.endDate, data.endClock, 'เวลาสิ้นสุด');
    data.startTime = start.toISOString();
    data.endTime = end.toISOString();
    delete data.startDate;
    delete data.startClock;
    delete data.endDate;
    delete data.endClock;
    if (data.meetingType !== 'OFFSITE') data.gpsUrl = '';
    return data;
  }

  function getSelectedMeetingType() {
    return (new FormData(form).get('meetingType') || 'ONSITE').toUpperCase();
  }

  function getRoomOptionsForMeetingType(meetingType) {
    if (meetingType === 'ONLINE') {
      return state.rooms.filter((room) => String(room.type).toUpperCase() === 'ONLINE');
    }
    if (meetingType === 'OFFSITE') {
      return state.rooms.filter((room) => String(room.type).toUpperCase() === 'OFFSITE');
    }
    return state.rooms.filter((room) => String(room.type).toUpperCase() === 'ONSITE');
  }

  function meetingTypeLabel(type) {
    if (type === 'ONLINE') return 'Online';
    if (type === 'OFFSITE') return 'นอกสถานที่';
    return 'Onsite';
  }

  function renderRooms() {
    const meetingType = getSelectedMeetingType();
    const availableRooms = getRoomOptionsForMeetingType(meetingType);
    gpsField.hidden = meetingType !== 'OFFSITE';
    attendeeField.hidden = meetingType !== 'ONLINE';

    if (!availableRooms.length) {
      roomSelect.innerHTML = '<option value="">ไม่มีทรัพยากรสำหรับรูปแบบนี้</option>';
      roomHint.textContent = 'ไม่พบทรัพยากรที่เปิดใช้งานสำหรับรูปแบบประชุมที่เลือก';
      return;
    }

    roomSelect.innerHTML = availableRooms.map((room) => `
      <option value="${escapeHtml(room.id)}">${escapeHtml(room.name)} (ความจุ ${escapeHtml(room.capacity)} คน · ${escapeHtml(room.location)})</option>

    const filterOptions = state.rooms.map((room) => `<option value="${escapeHtml(room.id)}">${escapeHtml(room.name)}</option>`).join('');
    filterRoom.innerHTML = `<option value="">ทั้งหมด</option>${filterOptions}`;
    calendarFilterRoom.innerHTML = `<option value="">ทั้งหมด</option>${filterOptions}`;

  function renderBookings(items) {
    metricBookings.textContent = items.length;
    metricRooms.textContent = state.rooms.length;

    if (!items.length) {
      bookingsEl.innerHTML = '<div class="empty">ยังไม่มีรายการจองในระบบ</div>';

    bookingsEl.innerHTML = items.slice(0, 10).map((booking) => `
      <article class="booking-item">

          <span class="badge ${String(booking.meetingType || 'ONSITE').toLowerCase()}">${escapeHtml(meetingTypeLabel(booking.meetingType))}</span>
        </div>
        <div class="meta">
          <span>${formatDateTime(booking.startTime)} - ${formatDateTime(booking.endTime)}</span>

        </div>

  function getFilterValues(prefix) {
    if (prefix === 'calendar') {
      return {
        roomId: calendarFilterRoom.value,
        meetingType: calendarFilterType.value,
        department: calendarFilterDepartment.value,
        fromDate: parseDateOnly(calendarFilterFromDate.value, 'ตั้งแต่วันที่', false),
        toDate: parseDateOnly(calendarFilterToDate.value, 'ถึงวันที่', true),
        search: calendarFilterSearch.value.trim().toLowerCase()
      };
    }
    return {
      roomId: filterRoom.value,
      meetingType: filterType.value,
      department: filterDepartment.value,
      fromDate: parseDateOnly(filterFromDate.value, 'ตั้งแต่วันที่', false),
      toDate: parseDateOnly(filterToDate.value, 'ถึงวันที่', true),
      search: filterSearch.value.trim().toLowerCase()
    };
  }

  function filterBookingItems(filters) {
    return state.bookings.filter((booking) => {
      if (filters.roomId && booking.roomId !== filters.roomId) return false;
      if (filters.meetingType && String(booking.meetingType).toUpperCase() !== filters.meetingType) return false;
      if (filters.department === NO_DEPARTMENT && booking.department) return false;
      if (filters.department && filters.department !== NO_DEPARTMENT && booking.department !== filters.department) return false;
      const start = new Date(booking.startTime);
      const end = new Date(booking.endTime);
      if (filters.fromDate && end < filters.fromDate) return false;
      if (filters.toDate && start > filters.toDate) return false;
      if (filters.search) {
        const text = [
          booking.title,
          booking.requesterName,
          booking.requesterEmail,
          booking.roomName,
          departmentLabel(booking.department),
          booking.notes
        ].join(' ').toLowerCase();
        if (!text.includes(filters.search)) return false;
      }
      return true;
    });
  }

  function renderSummaryCounts(items, prefix) {
    const total = items.length;
    const online = items.filter((b) => b.meetingType === 'ONLINE').length;
    const onsite = items.filter((b) => b.meetingType === 'ONSITE').length;
    const offsite = items.filter((b) => b.meetingType === 'OFFSITE').length;

    if (prefix === 'calendar') {
      calendarFilteredCount.textContent = total;
      calendarOnlineCount.textContent = online;
      calendarOnsiteCount.textContent = onsite;
      calendarOffsiteCount.textContent = offsite;
    } else {
      filteredCount.textContent = total;
      onlineCount.textContent = online;
      onsiteCount.textContent = onsite;
      offsiteCount.textContent = offsite;
    }
  }

      bookingTableBody.innerHTML = '<tr><td colspan="7">ไม่พบรายการจองตามเงื่อนไขที่ค้นหา</td></tr>';

    filteredCards.innerHTML = items.map((booking) => `
      <article class="booking-card-item">
        <div class="booking-top">
          <span class="booking-title">${escapeHtml(booking.title)}</span>
          <span class="badge ${String(booking.meetingType || 'ONSITE').toLowerCase()}">${escapeHtml(meetingTypeLabel(booking.meetingType))}</span>
        </div>
        <div class="meta">
          <span><strong>เวลา:</strong> ${formatDateTime(booking.startTime)} - ${formatDateTime(booking.endTime)}</span>
          <span><strong>ห้อง:</strong> ${escapeHtml(booking.roomName || booking.roomId)}</span>
          <span><strong>ฝ่าย:</strong> ${escapeHtml(departmentLabel(booking.department))}</span>
          <span><strong>ผู้จอง:</strong> ${escapeHtml(booking.requesterName)} ${booking.requesterEmail ? `(${escapeHtml(booking.requesterEmail)})` : ''}</span>
          ${booking.notes ? `<span><strong>หมายเหตุ:</strong> ${escapeHtml(booking.notes)}</span>` : ''}
          ${parseAttendees(booking.attendeeEmails).length ? `<span><strong>ผู้ร่วมจัด:</strong> ${parseAttendees(booking.attendeeEmails).length} คน</span>` : ''}
          ${booking.meetUrl ? `<a href="${safeUrl(booking.meetUrl)}" target="_blank" rel="noopener">เปิด Google Meet</a>` : ''}
          ${booking.gpsUrl ? `<a href="${safeUrl(booking.gpsUrl)}" target="_blank" rel="noopener">เปิด GPS / Google Maps</a>` : ''}
        </div>
      </article>
    `).join('');

    bookingTableBody.innerHTML = items.map((booking) => `
      <tr>
        <td>${formatDateTime(booking.startTime)}<br><small class="muted">ถึง ${formatDateTime(booking.endTime)}</small></td>
        <td><strong>${escapeHtml(booking.title)}</strong>${booking.notes ? `<br><small class="muted">${escapeHtml(booking.notes)}</small>` : ''}</td>
        <td>${escapeHtml(booking.roomName || booking.roomId)}</td>
        <td>${escapeHtml(booking.requesterName)}${booking.requesterEmail ? `<br><small class="muted">${escapeHtml(booking.requesterEmail)}</small>` : ''}<br><small class="muted">${escapeHtml(departmentLabel(booking.department))}</small></td>
        <td><span class="badge ${String(booking.meetingType || 'ONSITE').toLowerCase()}">${escapeHtml(meetingTypeLabel(booking.meetingType))}</span></td>
        <td>${booking.meetUrl ? `<a href="${safeUrl(booking.meetUrl)}" target="_blank" rel="noopener">เข้า Meet</a>` : '-'}</td>
        <td>${booking.gpsUrl ? `<a href="${safeUrl(booking.gpsUrl)}" target="_blank" rel="noopener">เปิดแผนที่</a>` : '-'}</td>
      </tr>
    `).join('');
  }

  function groupBookingsByDay(items) {
    const groups = {};
    items.forEach((booking) => {
      const dayKey = formatDayKey(booking.startTime);
      if (!groups[dayKey]) groups[dayKey] = [];
      groups[dayKey].push(booking);
    });
    return groups;
  }

  function renderCalendar() {
    let items = [];
    try {
      items = filterBookingItems(getFilterValues('calendar'));
    } catch (error) {
      showToast(error.message, 'error');
      return;
    }

    renderSummaryCounts(items, 'calendar');

    if (!items.length) {
      calendarBoard.innerHTML = '<div class="empty">ไม่พบรายการจองตามเงื่อนไขที่เลือกในปฏิทิน</div>';
      return;
    }

    const groups = groupBookingsByDay(items);
    const sortedDays = Object.keys(groups).sort((a, b) => {
      const first = groups[a][0] ? new Date(groups[a][0].startTime) : 0;
      const second = groups[b][0] ? new Date(groups[b][0].startTime) : 0;
      return first - second;
    });

    calendarBoard.innerHTML = sortedDays.map((dayKey) => {
      const dayBookings = groups[dayKey];
      return `
        <section class="calendar-day-column">
          <header class="calendar-day-header">
            <strong>${dayKey}</strong>
            <span>${dayBookings.length} รายการ</span>
          </header>
          <div class="calendar-events">
            ${dayBookings.map((booking) => `
              <article class="calendar-event-card ${String(booking.meetingType || 'ONSITE').toLowerCase()}">
                <div class="event-time">${formatTimeInput(new Date(booking.startTime))} - ${formatTimeInput(new Date(booking.endTime))} น.</div>
                <strong class="event-title">${escapeHtml(booking.title)}</strong>
                <div class="event-meta">
                  <span>${escapeHtml(booking.roomName || booking.roomId)}</span>
                  <span>${escapeHtml(booking.requesterName)}</span>
                  <span>${escapeHtml(departmentLabel(booking.department))}</span>
                </div>
                ${booking.meetUrl ? `<a class="event-link" href="${safeUrl(booking.meetUrl)}" target="_blank" rel="noopener">Google Meet</a>` : ''}
                ${booking.gpsUrl ? `<a class="event-link" href="${safeUrl(booking.gpsUrl)}" target="_blank" rel="noopener">แผนที่ GPS</a>` : ''}
              </article>
            `).join('')}
          </div>
        </section>
      `;
    }).join('');
  }

  function applyBookings(items) {
    state.bookings = items || [];
    renderBookings(state.bookings);
    renderList();
    renderCalendar();
  }

  /* ---------- Staff sign-in with a mobile number ---------- */

  function memberDisplayName(member) {
    return member.nickName ? `${member.fullName} (${member.nickName})` : member.fullName;
  }

  // Booking needs a signed-in staff member (or an admin booking on someone's behalf);
  // "รายการจอง" always needs the staff member themself.
  function updateMemberViews() {
    const onBooking = state.currentTab === 'booking';
    const onMine = state.currentTab === 'mine';
    const needsSignIn = (onBooking && !state.member && !state.adminSessionToken) || (onMine && !state.member);
    memberGate.hidden = !needsSignIn;
    bookingLayout.hidden = onBooking && needsSignIn;
    myBookingsPanel.hidden = !state.member;
    memberBar.hidden = !(state.member && (onBooking || onMine));
    if (state.member) {
      memberBarName.textContent = memberDisplayName(state.member);
      memberBarPhone.textContent = state.member.phone;
    }
    applyRequesterFields();
  }

  function applyRequesterFields() {
    const nameInput = form.elements.requesterName;
    const emailInput = form.elements.requesterEmail;
    if (state.member) {
      nameInput.value = memberDisplayName(state.member);
      nameInput.readOnly = true;
      if (!emailInput.value) emailInput.value = state.member.email || '';
    } else if (nameInput.readOnly) {
      nameInput.readOnly = false;
      nameInput.value = '';
      emailInput.value = '';
      departmentSelect.value = '';
    }
    applyDepartmentDefault();
  }

  // The booking's department starts as the one this staff member last booked for, else the department
  // on file for their phone number (asset system or registration). They can always pick another.
  function applyDepartmentDefault() {
    if (departmentSelect.value || !state.member) return;
    const preferred = [state.member.lastDepartment, state.member.department]
      .map((name) => String(name || '').trim().toLowerCase())
      .filter((name) => name);
    const match = preferred.map((name) => state.departments.find((item) => item.name.toLowerCase() === name)).find((item) => item);
    if (match) departmentSelect.value = match.name;
  }

  // Remember the department just booked for, on this page and in the remembered sign-in.
  function rememberMemberDepartment(department) {
    if (!state.member || !department) return;
    state.member.lastDepartment = department;
    try {
      const saved = JSON.parse(localStorage.getItem('member_session') || 'null');
      if (saved && saved.member && saved.member.id === state.member.id) {
        saved.member.lastDepartment = department;
        localStorage.setItem('member_session', JSON.stringify(saved));
      }
    } catch (e) {}
  }

  function departmentOptions() {
    return state.departments.map((item) => `<option value="${escapeHtml(item.name)}">${escapeHtml(item.label)}</option>`).join('');
  }

  // The booking form, the list filter and the calendar filter all choose from the same departments.
  function renderDepartmentOptions() {
    const selected = departmentSelect.value;
    departmentSelect.innerHTML = '<option value="">— เลือกฝ่าย —</option>' + departmentOptions();
    if (state.departments.some((item) => item.name === selected)) departmentSelect.value = selected;
    applyDepartmentDefault();
    [filterDepartment, calendarFilterDepartment].forEach((select) => {
      const current = select.value;
      select.innerHTML = '<option value="">ทั้งหมด</option>' + departmentOptions() + `<option value="${NO_DEPARTMENT}">ไม่ระบุฝ่าย</option>`;
      if (Array.from(select.options).some((option) => option.value === current)) select.value = current;
    });
  }

  const NO_DEPARTMENT = '__none__';

  function departmentLabel(name) {
    const match = state.departments.find((item) => item.name === name);
    if (match) return match.label;
    if (!name) return 'ไม่ระบุฝ่าย';
    return name.indexOf('ฝ่าย') === 0 ? name : `ฝ่าย${/^[A-Za-z0-9]/.test(name) ? ' ' : ''}${name}`;
  }

  function showMemberLoginStep() {
    memberLoginStep.hidden = false;
    memberRegisterStep.hidden = true;
    state.registerPhone = '';
  }

  function showMemberRegisterStep(result) {
    state.registerPhone = result.phone;
    memberRegisterPhone.textContent = result.phone;
    memberDepartmentOptions.innerHTML = (result.departments || []).map((department) => `<option value="${escapeHtml(department)}"></option>`).join('');
    memberLoginStep.hidden = true;
    memberRegisterStep.hidden = false;
    memberFullName.focus();
  }

  function setMember(session, remember) {
    state.memberToken = session.token;
    state.member = session.member;
    try {
      if (remember) localStorage.setItem('member_session', JSON.stringify({ token: session.token, member: session.member }));
      else localStorage.removeItem('member_session');
    } catch (e) {}
    showMemberLoginStep();
    memberPhoneInput.value = '';
    updateMemberViews();
    if (state.currentTab === 'mine') loadMyBookings();
  }

  function clearMember() {
    state.member = null;
    state.memberToken = '';
    state.myBookings = [];
    myUpcomingList.innerHTML = '';
    myHistoryList.innerHTML = '';
    try { localStorage.removeItem('member_session'); } catch (e) {}
    showMemberLoginStep();
    updateMemberViews();
  }

  async function memberLogin() {
    memberLoginButton.disabled = true;
    showLoading('กำลังตรวจสอบเบอร์มือถือ...');
    try {
      const remember = memberRememberToggle.checked;
      const result = await callApi('memberLogin', { phone: memberPhoneInput.value, remember });
      if (result.status === 'register') {
        showMemberRegisterStep(result);
      } else {
        setMember(result, remember);
        showToast(`ยินดีต้อนรับ ${memberDisplayName(result.member)}`, 'success');
      }
    } catch (error) {
      showResult({ eyebrow: 'Sign in', title: 'เข้าสู่ระบบไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      memberLoginButton.disabled = false;
    }
  }

  async function memberRegister() {
    memberRegisterButton.disabled = true;
    showLoading('กำลังลงทะเบียน...');
    try {
      const remember = memberRememberToggle.checked;
      const result = await callApi('memberRegister', {
        phone: state.registerPhone,
        fullName: memberFullName.value,
        nickName: memberNickName.value,
        department: memberDepartment.value,
        email: memberEmail.value,
        remember
      });
      setMember(result, remember);
      [memberFullName, memberNickName, memberDepartment, memberEmail].forEach((input) => { input.value = ''; });
      showToast('ลงทะเบียนเรียบร้อย เข้าสู่ระบบแล้ว', 'success');
    } catch (error) {
      showResult({ eyebrow: 'Register', title: 'ลงทะเบียนไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      memberRegisterButton.disabled = false;
    }
  }

  async function memberLogout() {
    const token = state.memberToken;
    clearMember();
    showToast('ออกจากระบบแล้ว', 'success');
    try { await callApi('memberLogout', { memberToken: token }); } catch (e) {}
  }

  async function restoreMemberSession() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem('member_session') || 'null'); } catch (e) {}
    if (!saved || !saved.token) return;
    try {
      const member = await callApi('memberVerify', { memberToken: saved.token });
      setMember({ token: saved.token, member }, true);
    } catch (error) {
      clearMember();
    }
  }

  function myBookingCard(booking) {
    const cancelled = booking.status === 'CANCELLED';
    const attendees = parseAttendees(booking.attendeeEmails);
    const recordingIds = String(booking.recordingFileId || '').split(',').map((id) => id.trim()).filter((id) => /^[A-Za-z0-9_-]+$/.test(id));
    const statusBadge = cancelled ? '<span class="badge cancelled">ยกเลิกแล้ว</span>' : '<span class="badge confirmed">ยืนยันแล้ว</span>';
    return `
      <article class="booking-item my-booking-item${cancelled ? ' is-cancelled' : ''}">
        <div class="booking-top">
          <span class="booking-title">${escapeHtml(booking.title)}</span>
          <span><span class="badge ${escapeHtml(String(booking.meetingType || 'ONSITE').toLowerCase())}">${escapeHtml(meetingTypeLabel(booking.meetingType))}</span> ${statusBadge}</span>
        </div>
        <div class="meta">
          <span>${formatDateTime(booking.startTime)} - ${formatDateTime(booking.endTime)}</span>
          <span>${escapeHtml(booking.roomName || booking.roomId)}</span>
          <span>${escapeHtml(departmentLabel(booking.department))}</span>
          ${attendees.length ? `<span>ผู้ร่วมจัด ${attendees.length} คน: ${escapeHtml(attendees.join(', '))}</span>` : ''}
          ${booking.notes ? `<span>หมายเหตุ: ${escapeHtml(booking.notes)}</span>` : ''}
          ${booking.meetUrl && !cancelled ? `<a href="${safeUrl(booking.meetUrl)}" target="_blank" rel="noopener">เข้า Google Meet</a>` : ''}
          ${recordingIds.map((id, index) => `<a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">ไฟล์บันทึก${recordingIds.length > 1 ? ` ${index + 1}` : ''}</a>`).join('')}
          ${booking.gpsUrl ? `<a href="${safeUrl(booking.gpsUrl)}" target="_blank" rel="noopener">เปิด GPS / Google Maps</a>` : ''}

  function renderMyBookings(data) {
    state.myBookings = (data.upcoming || []).concat(data.history || []);
    myUpcomingList.innerHTML = (data.upcoming || []).length
      ? data.upcoming.map(myBookingCard).join('')
      : '<div class="empty">ยังไม่มีรายการที่กำลังจะถึง กดแท็บ "จองห้อง" เพื่อจองได้เลย</div>';
    myHistoryList.innerHTML = (data.history || []).length
      ? data.history.map(myBookingCard).join('')
      : '<div class="empty">ยังไม่มีประวัติการจอง</div>';

  async function loadMyBookings() {
    if (!state.memberToken) return;
    try {
      renderMyBookings(await callApi('memberBookings', { memberToken: state.memberToken }));
    } catch (error) {
      if (/เข้าสู่ระบบ/.test(error.message)) clearMember();
      showResult({ eyebrow: 'My Bookings', title: 'โหลดรายการจองไม่สำเร็จ', message: error.message });
    }
  }

  async function cancelMyBooking(bookingId) {
    const booking = state.myBookings.find((item) => item.id === bookingId);
    if (!booking || !window.confirm(`ยืนยันยกเลิกการจอง "${booking.title}" ${formatDateTime(booking.startTime)}?`)) return;
    showLoading('กำลังยกเลิกการจอง...');
    try {
      await callApi('memberCancelBooking', { memberToken: state.memberToken, bookingId });
      await loadMyBookings();
      showToast('ยกเลิกการจองแล้ว', 'success');
    } catch (error) {
      showResult({ eyebrow: 'My Bookings', title: 'ยกเลิกไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
    }
  }

  function switchTab(tabId) {
    state.currentTab = tabId;
    document.querySelectorAll('.tab-button').forEach((button) => {
      button.classList.toggle('active', button.dataset.tab === tabId);
    });
    document.querySelectorAll('.tab-view').forEach((view) => {
      view.classList.toggle('active', view.id === `tab-${tabId}`);
    });
    updateMemberViews();
    if (tabId === 'mine' && state.member) loadMyBookings();
  }

          <span>${Number(row.total)} รายการ${row.online ? ` (ออนไลน์ ${Number(row.online)})` : ''}</span>

  async function loadAdminBookings() {

      }
      adminBookingTableBody.innerHTML = state.adminBookings.map((booking) => {
        const isCancelled = booking.status === 'CANCELLED';
        const isOnline = booking.meetingType === 'ONLINE';
        const attendees = parseAttendees(booking.attendeeEmails);
        const meetStatus = String(booking.meetConfigStatus || '').toUpperCase();
        const needsMeetRetry = isOnline && !isCancelled && booking.meetUrl && meetStatus !== 'CONFIGURED' && meetStatus !== 'DISABLED';
        const canEditAttendees = isOnline && !isCancelled && booking.calendarEventId && new Date(booking.endTime) > new Date();
        // Admins always see the recordings; requesters see them in their own list only when shared with co-hosts.
        const recordingIds = String(booking.recordingFileId || '').split(',').map((id) => id.trim()).filter((id) => /^[A-Za-z0-9_-]+$/.test(id));
        const recordingLinks = recordingIds.map((id, index) => `<a href="https://drive.google.com/file/d/${id}/view" target="_blank" rel="noopener">ไฟล์บันทึก${recordingIds.length > 1 ? ` ${index + 1}` : ''}</a>`).join(' · ');

          <tr>
            <td>${formatDateTime(booking.startTime)}<br><small class="muted">ถึง ${formatDateTime(booking.endTime)}</small></td>
            <td><strong>${escapeHtml(booking.title)}</strong>${booking.meetUrl ? `<br><a href="${safeUrl(booking.meetUrl)}" target="_blank" rel="noopener">เปิด Google Meet</a>` : ''}${recordingLinks ? `<br><small class="recording-links">${recordingLinks}</small>` : ''}${attendees.length ? `<small class="muted attendee-summary">ผู้ร่วมจัด ${attendees.length} คน: ${escapeHtml(attendees.join(', '))}</small>` : ''}</td>
            <td>${escapeHtml(booking.roomName || booking.roomId)}<br><span class="badge ${escapeHtml(String(booking.meetingType || 'ONSITE').toLowerCase())}">${escapeHtml(meetingTypeLabel(booking.meetingType))}</span><br><small class="muted">${escapeHtml(departmentLabel(booking.department))}</small></td>
            <td>${escapeHtml(booking.requesterName)}${booking.requesterPhone ? `<br><small class="muted">${escapeHtml(booking.requesterPhone)}</small>` : ''}${booking.requesterEmail ? `<br><small class="muted">${escapeHtml(booking.requesterEmail)}</small>` : ''}</td>
            <td><span class="badge ${isCancelled ? 'cancelled' : 'confirmed'}">${isCancelled ? 'ยกเลิกแล้ว' : 'ปกติ'}</span></td>
            <td>
              <div class="table-actions">
                ${canEditAttendees ? `<button type="button" class="secondary admin-edit-attendees" data-booking-id="${escapeHtml(booking.id)}">ผู้ร่วมจัด (${attendees.length})</button>` : ''}
                ${needsMeetRetry ? `<button type="button" class="secondary admin-configure-meet" data-booking-id="${escapeHtml(booking.id)}">ลองตั้งค่า Meet อีกครั้ง</button>` : ''}
                ${!isCancelled ? `<button type="button" class="danger-button admin-cancel-booking" data-booking-id="${escapeHtml(booking.id)}">ยกเลิกจอง</button>` : '<span class="muted">-</span>'}

          </tr>

    } catch (error) {
      showResult({ eyebrow: 'Bookings', title: 'โหลดรายการจองไม่สำเร็จ', message: error.message });
    } finally {
      adminBookingsButton.disabled = !state.adminSessionToken;
    }
  }

  const auditEntityLabels = {
    admin: 'บัญชีผู้ดูแล',
    member: 'ผู้ใช้ (เบอร์มือถือ)',
    booking: 'รายการจอง',
    room: 'ห้องหรือทรัพยากร',
    settings: 'การตั้งค่าระบบ',
    recording: 'ไฟล์บันทึก Google Meet',

    system: 'บัญชีระบบ',
    maintenance: 'งานบำรุงรักษาระบบ',
    sheet: 'ชีตข้อมูล',
    api: 'การทำงานของระบบ'
  };

  function parseAuditDetails(value) {
    if (!value) return {};
    if (typeof value === 'object') return value;
    try {
      const parsed = JSON.parse(value);
      return parsed && typeof parsed === 'object' ? parsed : { note: value };
    } catch (error) {
      return { note: String(value) };
    }
  }

  function auditActorLabel(actor) {
    const value = String(actor || '').trim();
    if (!value || value === 'SYSTEM') return 'ระบบอัตโนมัติ';
    if (value === 'ADMIN') return 'ผู้ดูแลระบบ';
    return value;
  }

  function auditActionLabel(action) {
    return auditActionLabels[action] || 'ดำเนินการในระบบ';
  }

  function auditEntityLabel(entityType) {
    return auditEntityLabels[String(entityType || '').toLowerCase()] || 'ข้อมูลในระบบ';
  }

  function auditToggleLabel(value) {
    const normalized = String(value).trim().toLowerCase();
    return value === true || normalized === 'true' || normalized === 'on' || normalized === '1' ? 'เปิด' : 'ปิด';
  }

  function auditMeetRoomSummary(meet) {
    if (!meet) return '';
    if (meet.source === 'CALENDAR') return `ห้องจาก Google Calendar (ไม่มีผู้ร่วมจัด)${meet.fallbackReason ? `: ${meet.fallbackReason}` : ''}`;
    const members = meet.members || {};
    if (members.error) return `สร้างห้องแล้ว แต่ตั้งผู้ร่วมจัดไม่สำเร็จ: ${members.error}`;
    const others = (members.members || []).length;
    const failed = (members.failed || []).length;
    return `ผู้ร่วมจัด ${(members.coHosts || []).length} คน${others ? `, เข้าห้องได้ทันที ${others} คน` : ''}${failed ? `, ไม่สำเร็จ ${failed} คน` : ''}`;
  }

  function auditMeetStatusLabel(value) {
    const labels = {
      CONFIGURED: 'ตั้งค่าสำเร็จ',
      CONFIGURED_PARTIAL: 'ตั้งค่าได้บางส่วน',
      DISABLED: 'ปิดใช้งาน',
      PENDING_SETUP: 'รอตั้งค่า'
    };
    return labels[value] || value || '-';
  }

  function auditEmailResult(value) {
    const wrapper = value && typeof value === 'object' ? value : {};
    if (wrapper.ok === false) return `ส่งไม่สำเร็จ: ${wrapper.error || 'ไม่ทราบสาเหตุ'}`;
    const result = wrapper.result && typeof wrapper.result === 'object' ? wrapper.result : wrapper;
    if (result.sent) return result.to ? `ส่งแล้วไปยัง ${result.to}` : 'ส่งแล้ว';
    if (result.skipped && !result.enabled) return 'ไม่ได้ส่ง เพราะฟีเจอร์อีเมลปิดอยู่';
    if (result.skipped && !result.hasEmail) return 'ไม่ได้ส่ง เพราะผู้จองไม่ได้กรอกอีเมล';
    return 'ไม่ได้ส่งอีเมล';
  }

  function auditCalendarResult(value) {
    const wrapper = value && typeof value === 'object' ? value : {};
    if (wrapper.ok === false) return `ลบไม่สำเร็จ: ${wrapper.error || 'ไม่ทราบสาเหตุ'}`;
    const result = wrapper.result && typeof wrapper.result === 'object' ? wrapper.result : wrapper;
    if (result.deleted) return 'ลบกิจกรรมออกจาก Google Calendar แล้ว';
    if (result.skipped) return 'ไม่มี Google Calendar ที่ต้องลบ';
    return 'ไม่มีข้อมูลการลบกิจกรรม';
  }

  function auditLine(label, value) {
    return { label: label, value: value === undefined || value === null || value === '' ? '-' : String(value) };
  }

  function auditOptionalLine(label, value) {
    return value === undefined || value === null || value === '' ? null : auditLine(label, value);
  }

  function auditMeetingTypeLabel(value) {
    if (value === 'ONLINE') return 'ออนไลน์ (Google Meet)';
    if (value === 'ONSITE') return 'ประชุมในห้อง';
    if (value === 'OFFSITE') return 'ประชุมนอกสถานที่';
    return value || '-';
  }

  function formatAuditDetails(item) {
    const details = parseAuditDetails(item.details);
    switch (item.action) {
      case 'ADMIN_LOGIN':
        return [auditLine('ผลลัพธ์', 'เข้าสู่ระบบผู้ดูแลสำเร็จ')];
      case 'MEMBER_LOGIN':
      case 'MEMBER_REGISTERED':
        return [auditLine('ข้อมูลผู้ใช้จาก', details.source === 'asset' ? 'รายชื่อพนักงานในระบบทรัพย์สิน' : 'ลงทะเบียนเองในระบบจองห้อง')];
      case 'ADMIN_CREATED':
        return [auditLine('สิทธิ์ที่กำหนด', details.role === 'SUPER_ADMIN' ? 'ผู้ดูแลระบบสูงสุด' : details.role)];
      case 'BOOKING_CREATED':
        return [
          auditOptionalLine('หัวข้อประชุม', details.title),
          auditOptionalLine('ชื่อผู้จอง', details.requesterName),
          auditOptionalLine('ฝ่าย', details.department ? departmentLabel(details.department) : ''),
          auditOptionalLine('รูปแบบประชุม', details.meetingType ? auditMeetingTypeLabel(details.meetingType) : ''),
          auditLine('ห้องหรือทรัพยากร', details.roomName || details.roomId),
          auditOptionalLine('ช่วงเวลา', details.startTime && details.endTime ? `${formatDateTime(details.startTime)} ถึง ${formatDateTime(details.endTime)}` : ''),
          auditOptionalLine('ผู้ร่วมจัดที่กรอก', details.attendeeCount ? `${Number(details.attendeeCount)} คน` : ''),
          auditOptionalLine('ห้อง Google Meet', auditMeetRoomSummary(details.meet)),
          auditLine('การแจ้งอีเมล', auditEmailResult(details.emailNotification))
        ].filter(Boolean);
      case 'BOOKING_ATTENDEES_UPDATED':
        return [
          auditOptionalLine('หัวข้อประชุม', details.title),
          auditLine('เพิ่ม', Array.isArray(details.added) && details.added.length ? details.added.join(', ') : 'ไม่มี'),
          auditLine('ลบ', Array.isArray(details.removed) && details.removed.length ? details.removed.join(', ') : 'ไม่มี'),
          auditLine('ผู้ร่วมจัดทั้งหมด', `${Number(details.attendeeCount || 0)} คน (ไม่นับผู้จอง)`),
          auditOptionalLine('ผู้ร่วมจัดใน Meet', details.meetMembers ? (details.meetMembers.ok && details.meetMembers.result ? auditMeetStatusLabel(details.meetMembers.result.status) : `ไม่สำเร็จ: ${details.meetMembers.error || '-'}`) : '')
        ].filter(Boolean);
      case 'DEPARTMENT_ADDED':
      case 'DEPARTMENT_REMOVED':
        return [
          auditLine('ฝ่าย', departmentLabel(details.name)),
          auditLine('ฝ่ายที่ผู้ดูแลเพิ่มไว้ทั้งหมด', Array.isArray(details.extras) && details.extras.length ? details.extras.map(departmentLabel).join(', ') : 'ไม่มี')
        ];
      case 'RECORDINGS_FOLDER_CHANGED':
        return [
          auditLine('โฟลเดอร์', details.name || details.id),
          auditOptionalLine('เจ้าของโฟลเดอร์', details.ownerEmail),
          auditOptionalLine('ลิงก์', details.url)
        ].filter(Boolean);
      case 'SYSTEM_ACCOUNT_ACTIVATED':
        return [
          auditLine('บัญชีระบบ', item.actor),
          auditLine('นโยบายห้องประชุม', details.policyApplied ? 'ตั้งค่าใหม่แล้ว' : 'ใช้ค่าที่ตั้งไว้เดิม'),
          auditLine('ผลตรวจระบบ', details.diagnosticsOk ? 'ผ่านทุกข้อ' : `มีข้อที่ไม่ผ่าน: ${(details.failedChecks || []).join(' | ')}`)
        ];
      case 'BOOKING_CANCELLED':
        return [
          auditOptionalLine('หัวข้อประชุม', details.title),
          auditOptionalLine('ชื่อผู้จอง', details.requesterName),
          auditOptionalLine('ฝ่าย', details.department ? departmentLabel(details.department) : ''),
          auditOptionalLine('รูปแบบประชุม', details.meetingType ? auditMeetingTypeLabel(details.meetingType) : ''),
          auditLine('ห้องหรือทรัพยากร', details.roomName || details.roomId),
          auditLine('ช่วงเวลาเดิม', `${formatDateTime(details.startTime)} ถึง ${formatDateTime(details.endTime)}`),
          auditLine('Google Calendar', auditCalendarResult(details.calendarDelete)),
          auditLine('การแจ้งอีเมล', auditEmailResult(details.emailNotification))
        ].filter(Boolean);
      case 'ROOM_STATUS_CHANGED':
        return [
          auditOptionalLine('ชื่อทรัพยากร', details.roomName),
          auditLine('สถานะใหม่', auditToggleLabel(details.active) === 'เปิด' ? 'เปิดให้จอง' : 'ปิดไม่ให้จอง')
        ].filter(Boolean);
      case 'FEATURE_SETTINGS_UPDATED':
        return [
          auditLine('อีเมลแจ้งจอง/ยกเลิก', auditToggleLabel(details.emailNotificationsEnabled)),
          details.calendarInviteRequesterEnabled === undefined ? null : auditLine('เชิญอีเมลผู้จองเข้า Meet', auditToggleLabel(details.calendarInviteRequesterEnabled)),
          auditLine('ผู้มีลิงก์ Meet เข้าได้ทันที', auditToggleLabel(details.meetOpenAccessEnabled)),
          auditLine('บันทึก Meet อัตโนมัติ', auditToggleLabel(details.meetAutoRecordingEnabled)),
          details.meetCoHostsEnabled === undefined ? null : auditLine('ผู้จองและอีเมลที่กรอกเป็นผู้ร่วมจัด', auditToggleLabel(details.meetCoHostsEnabled)),
          details.meetRecordingsAdminOnly === undefined ? null : auditLine('ไฟล์บันทึกเฉพาะผู้ดูแล', auditToggleLabel(details.meetRecordingsAdminOnly)),
          auditLine('Auto End Meeting', auditToggleLabel(details.meetAutoEndEnabled)),
          auditLine('เวลาจับ 1 คน (นาที)', details.meetAutoEndMinutes || 10),
          auditOptionalLine('ผู้ร่วมจัดสูงสุดต่อการจอง', details.maxMeetingAttendees ? `${details.maxMeetingAttendees} อีเมล` : '')
        ].filter(Boolean);
      case 'MEET_ACCESS_CONFIGURED':
        return [
          auditOptionalLine('หัวข้อประชุม', details.bookingTitle),
          auditLine('ผลการตั้งค่า', auditMeetStatusLabel(details.status)),
          auditLine('การเข้าห้อง', details.accessType === 'OPEN' ? 'ผู้มีลิงก์เข้าได้ทันที' : (details.accessType || 'ไม่ได้รับค่า')),
          auditLine('บันทึกอัตโนมัติ', details.autoRecording === 'ON' ? 'เปิด' : (details.autoRecording || 'ไม่ได้รับค่า'))
        ].filter(Boolean);
      case 'MEET_RECORDINGS_SYNCED': {
        const results = Array.isArray(details.results) ? details.results : [];
        const synced = results.filter((entry) => entry && entry.ok !== false && entry.result && entry.result.synced).length;
        const failed = results.filter((entry) => entry && entry.ok === false).length;
        return [
          auditLine('รายการที่ตรวจ', Number(details.checked || 0)),
          auditLine('จัดเก็บสำเร็จ', `${synced} รายการ`),
          auditLine('ไม่สำเร็จ', `${failed} รายการ`),
          auditLine('โฟลเดอร์ปลายทาง', details.folderUrl || 'ยังไม่มีไฟล์พร้อมจัดเก็บ')
        ];
      }
      case 'MEET_RECORDING_ORGANIZED':
        return [
          auditOptionalLine('หัวข้อประชุม', details.bookingTitle),
          auditLine('ชื่อไฟล์ใหม่', details.fileName),
          auditOptionalLine('โฟลเดอร์ฝ่าย', details.folderName),
          auditLine('รหัสไฟล์ใน Drive', details.fileId),
          auditOptionalLine('เอาสิทธิ์ดูไฟล์ออก (เหลือเฉพาะผู้ดูแล)', Array.isArray(details.removedAccess) && details.removedAccess.length ? details.removedAccess.join(', ') : '')
        ].filter(Boolean);
      case 'MEET_AUTO_ENDED':
        return [
          auditOptionalLine('หัวข้อประชุม', details.bookingTitle),
          auditLine('Meet Code', details.meetCode),
          auditLine('เริ่มจับเวลา (1 คน)', formatDateTime(details.singletonSince)),
          auditLine('เวลาที่ระบบจบห้อง', formatDateTime(details.autoEndedAt)),
          auditLine('เหตุผล', details.reason)
        ].filter(Boolean);
      case 'MEET_AUTO_END_CHECK_RUN':
        return [
          auditLine('การรัน', 'สั่งตรวจสถานะด้วยตนเองในหน้า Admin'),
          auditLine('จำนวนห้องที่ตรวจ', Number(details.checked || 0)),
          auditLine('ผลลัพธ์', details.enabled ? 'เปิดเฝ้าระวัง' : 'ฟีเจอร์ปิดอยู่')
        ];
      case 'BOOKING_DATA_CLEARED':
        return [
          auditLine('รายการจองที่ลบ', `${Number(details.bookings || 0)} รายการ`),
          auditLine('ดัชนีเวลาที่ลบ', `${Number(details.bookingIndex || 0)} รายการ`),
          auditLine('กิจกรรม Calendar ที่ตรวจ', `${Array.isArray(details.calendarCleanup) ? details.calendarCleanup.length : 0} รายการ`)
        ];
      case 'SCHEMA_REPAIR':
        return [auditLine('ผลลัพธ์', 'ตรวจและซ่อมโครงสร้างชีตให้พร้อมใช้งาน')];
      case 'API_ERROR':
        return [auditLine('ข้อผิดพลาด', details.message || 'ไม่ทราบรายละเอียด')];
      default: {
        const visibleEntries = Object.keys(details).filter((key) => key !== 'diagnostics');
        if (!visibleEntries.length) return [auditLine('ผลลัพธ์', 'ดำเนินการสำเร็จ')];
        return visibleEntries.map((key) => {
          const value = details[key];
          if (Array.isArray(value)) return auditLine('ข้อมูลเพิ่มเติม', `${value.length} รายการ`);
          if (value && typeof value === 'object') return auditLine('ข้อมูลเพิ่มเติม', 'มีรายละเอียดทางเทคนิคที่บันทึกไว้ในระบบ');
          return auditLine('ข้อมูลเพิ่มเติม', value);
        });
      }
    }
  }

  function renderAuditDetailLines(lines) {
    return `<div class="audit-detail-list">${lines.map((line) => `
      <div class="audit-detail-line"><strong>${escapeHtml(line.label)}:</strong> ${escapeHtml(line.value)}</div>
    `).join('')}</div>`;
  }

  function renderAuditLogs(items) {
    if (!items.length) {
      adminAuditTableBody.innerHTML = '<tr><td colspan="5">ยังไม่มีประวัติการใช้งานระบบ</td></tr>';
      return;
    }
    adminAuditTableBody.innerHTML = items.map((item) => {
      const detailLines = formatAuditDetails(item);
      return `
        <tr>
          <td>${formatDateTime(item.timestamp)}</td>
          <td><span class="audit-actor">${escapeHtml(auditActorLabel(item.actor))}</span></td>
          <td><span class="audit-action">${escapeHtml(auditActionLabel(item.action))}</span></td>
          <td>${escapeHtml(auditEntityLabel(item.entityType))}<br><span class="muted audit-entity-id">รหัสอ้างอิง: ${escapeHtml(item.entityId || '-')}</span></td>
          <td>${renderAuditDetailLines(detailLines)}</td>
        </tr>
      `;
    }).join('');
  }

  async function loadAdminAuditLogs() {
    if (!state.adminSessionToken) return;
    adminAuditButton.disabled = true;
    try {
      const logs = await callApi('adminAuditLogs', { sessionToken: state.adminSessionToken, limit: 100 });
      renderAuditLogs(logs || []);
    } catch (error) {
      showResult({ eyebrow: 'Audit Log', title: 'โหลด Audit Log ไม่สำเร็จ', message: error.message });
    } finally {
      adminAuditButton.disabled = !state.adminSessionToken;
    }
  }

  function renderFeatureSettings(settings) {
    emailNotificationsToggle.checked = !!settings.emailNotificationsEnabled;
    meetOpenAccessToggle.checked = !!settings.meetOpenAccessEnabled;
    meetAutoRecordingToggle.checked = !!settings.meetAutoRecordingEnabled;
    meetCoHostsToggle.checked = !!settings.meetCoHostsEnabled;
    meetRecordingsAdminOnlyToggle.checked = !!settings.meetRecordingsAdminOnly;
    meetAutoEndToggle.checked = !!settings.meetAutoEndEnabled;
    meetAutoEndMinutesInput.value = settings.meetAutoEndMinutes || 10;
    if (settings.maxMeetingAttendees) {
      state.maxAttendees = Number(settings.maxMeetingAttendees);
      maxMeetingAttendeesInput.value = state.maxAttendees;
      bookingAttendees.render();
    }
  }

  function setFeatureSettingsState(message, stateClass) {
    adminFeatureSettingsState.textContent = message;
    adminFeatureSettingsState.className = `feature-settings-state${stateClass ? ` ${stateClass}` : ''}`;
  }

  async function loadAdminFeatureSettings() {
    if (!state.adminSessionToken) return;
    try {
      const settings = await callApi('adminFeatureSettings', { sessionToken: state.adminSessionToken });
      renderFeatureSettings(settings || {});
      setFeatureSettingsState('โหลดค่าที่บันทึกไว้แล้ว', 'is-saved');
    } catch (error) {
      setFeatureSettingsState(`โหลดการตั้งค่าไม่สำเร็จ: ${error.message}`, 'is-error');
      showResult({ eyebrow: 'Feature Settings', title: 'โหลดการตั้งค่าไม่สำเร็จ', message: error.message });
    }
  }

  function renderRecordingsFolder(folder) {
    if (!folder || !folder.configured) {
      recordingsFolderState.textContent = 'ยังไม่ได้ตั้งโฟลเดอร์ — ระบบจะสร้างโฟลเดอร์ใหม่ในไดรฟ์ของบัญชีระบบเมื่อมีไฟล์แรก';
      recordingsFolderState.className = 'feature-settings-state';
      return;
    }
    if (!folder.accessible) {
      recordingsFolderState.textContent = folder.error || 'เปิดโฟลเดอร์ไม่ได้';
      recordingsFolderState.className = 'feature-settings-state is-error';
      return;
    }
    recordingsFolderInput.value = folder.url || '';
    recordingsFolderState.textContent = `ใช้โฟลเดอร์ "${folder.name}"${folder.ownerEmail ? ` ของ ${folder.ownerEmail}` : ''}`;
    recordingsFolderState.className = 'feature-settings-state is-saved';
  }

  async function loadAdminRecordingsFolder() {
    if (!state.adminSessionToken) return;
    try {
      renderRecordingsFolder(await callApi('adminRecordingsFolder', { sessionToken: state.adminSessionToken }));
    } catch (error) {
      recordingsFolderState.textContent = `อ่านโฟลเดอร์ไม่สำเร็จ: ${error.message}`;
      recordingsFolderState.className = 'feature-settings-state is-error';
    }
  }

  // The account the deployment runs as organizes the meetings, so it must be the Workspace
  // system account for co-hosts and recording to work.
  async function loadSystemAccountState() {
    try {
      const account = await callApi('health', {});
      const matches = !account.systemAccount || account.systemAccount === account.runningAs;
      if (!account.systemAccount) {
        systemAccountState.textContent = `บัญชีที่รันระบบ: ${account.runningAs} (ยังไม่ได้เปิดใช้บัญชีระบบ)`;
      } else if (matches) {
        systemAccountState.textContent = `บัญชีที่รันระบบ: ${account.runningAs} — ตรงกับบัญชีระบบ`;
      } else {
        systemAccountState.textContent = `บัญชีที่รันระบบ: ${account.runningAs} — ไม่ตรงกับบัญชีระบบ ${account.systemAccount} ต้อง deploy ด้วยบัญชี ${account.systemAccount}`;
      }
      systemAccountState.className = `feature-settings-state ${matches ? 'is-saved' : 'is-error'}`;
    } catch (error) {
      systemAccountState.textContent = `ตรวจบัญชีที่รันระบบไม่สำเร็จ: ${error.message}`;
      systemAccountState.className = 'feature-settings-state is-error';
    }
  }

  function renderMeetAutoEndStatus(status) {
    if (!status) return;
    adminMeetAutoEndStatusBadge.textContent = status.enabled ? 'เปิดใช้งาน' : 'ปิดอยู่';
    adminMeetAutoEndStatusBadge.style.color = status.enabled ? '#0f9d58' : '#5f6368';
    adminMeetAutoEndMonitoredCount.textContent = status.monitoredCount || 0;
    const singletons = status.singletons || [];
    adminMeetAutoEndSingletonsCount.textContent = singletons.length;

    if (!singletons.length) {
      adminMeetAutoEndSingletonsTableBody.innerHTML = '<tr><td colspan="5">ไม่มีห้องที่เหลือผู้เข้าร่วมคนเดียวในขณะนี้</td></tr>';
      return;
    }

    adminMeetAutoEndSingletonsTableBody.innerHTML = singletons.map((item) => `
      <tr>
        <td><strong>${escapeHtml(item.title || '-')}</strong><br><small class="muted">${escapeHtml(item.roomName || '-')}</small></td>
        <td><code>${escapeHtml(item.meetCode || '-')}</code></td>
        <td>${formatDateTime(item.singletonSince)}</td>
        <td><strong style="color: #d93025;">${item.elapsedMinutes} นาที</strong></td>
        <td>ครบ ${item.minutesThreshold} นาที (ตรวจทุก ${status.intervalMinutes || 1} นาที)</td>
      </tr>
    `).join('');
  }

  async function loadAdminMeetAutoEndStatus() {
    if (!state.adminSessionToken) return;
    adminRunAutoEndCheckButton.disabled = true;
    try {
      const status = await callApi('adminMeetAutoEndStatus', { sessionToken: state.adminSessionToken });
      renderMeetAutoEndStatus(status);
    } catch (error) {
      console.error('loadAdminMeetAutoEndStatus error:', error.message);
    } finally {
      adminRunAutoEndCheckButton.disabled = !state.adminSessionToken;
    }
  }

  async function loadAdminWorkspace() {
    await Promise.allSettled([
      loadAdminDashboard(),
      loadAdminBookings(),
      loadAdminRooms(),
      loadAdminFeatureSettings(),
      loadAdminRecordingsFolder(),
      loadAdminDepartments(),
      loadSystemAccountState(),
      loadAdminMeetAutoEndStatus(),
      loadAdminAuditLogs()
    ]);
  }

  async function restoreAdminSession() {
    try {
      const saved = localStorage.getItem('admin_session');
      if (!saved) return;
      const parsed = JSON.parse(saved);
      if (!parsed || !parsed.token) return;
      const response = await callApi('adminVerifySession', { sessionToken: parsed.token });
      if (response && response.active) {
        setAdminLoggedIn({ sessionToken: parsed.token, username: parsed.username || response.username });
        await loadAdminWorkspace();
        await refreshBookings();
        showToast(`เข้าสู่ระบบผู้ดูแลอัตโนมัติ (${parsed.username || response.username})`, 'success');
      } else {
        localStorage.removeItem('admin_session');
      }
    } catch (error) {
      console.warn('Auto restore session:', error.message);
      try { localStorage.removeItem('admin_session'); } catch (e) {}
    }
  }

  async function load() {
    showLoading('กำลังโหลดข้อมูลระบบ...');
    try {
      setDefaultTimes();
      const bootstrap = await callApi('bootstrap');
      state.rooms = bootstrap.rooms || [];
      state.maxAttendees = Number((bootstrap.settings || {}).maxMeetingAttendees) || 24;
      state.ownerEmail = String((bootstrap.settings || {}).ownerEmail || '').toLowerCase();
      state.departments = (bootstrap.settings || {}).departments || [];
      renderDepartmentOptions();
      bookingAttendees.render();
      renderRooms();
      await restoreMemberSession();
      await restoreAdminSession();
      updateMemberViews();
      setStatus('พร้อมใช้งาน', 'success');
    } catch (error) {
      setStatus(error.message, 'error');
      showResult({ eyebrow: 'Load Error', title: 'โหลดระบบไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    let data;
    try {
      data = buildBookingPayload();
    } catch (error) {
      showResult({ eyebrow: 'ตรวจข้อมูล', title: 'กรุณาตรวจข้อมูลการจอง', message: error.message });
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = 'กำลังบันทึก...';
    setStatus('กำลังบันทึกการจอง...', '');
    showLoading(data.meetingType === 'ONLINE' ? 'กำลังจองและสร้าง Google Meet...' : 'กำลังบันทึกการจอง...');

    try {
      const identity = state.member ? { memberToken: state.memberToken } : { sessionToken: state.adminSessionToken };
      const booking = await callApi('createBooking', Object.assign({}, data, identity));
      if (state.member) rememberMemberDepartment(booking.department);
      form.reset();
      bookingAttendees.clear();
      setDefaultTimes();
      renderRooms();
      updateMemberViews();
      if (state.member) loadMyBookings();
      if (state.adminSessionToken) {
        await refreshBookings();
        await loadAdminBookings();
      }
      if (booking.meetUrl) {
        const invited = (booking.invitedEmails || []).filter((email) => email !== state.ownerEmail);
        setStatus('จองสำเร็จและสร้าง Google Meet แล้ว', 'success');
        showResult({
          eyebrow: 'Booking Confirmed',
          title: 'จองสำเร็จ พร้อม Google Meet',
          message: `ระบบสร้างรายการจอง ${formatDateTime(booking.startTime)} และส่งคำเชิญ Google Meet ทางอีเมลแล้ว ${invited.length} อีเมล${invited.length ? `\n${invited.join('\n')}` : ''}`,
          meetUrl: booking.meetUrl
        });
      } else {
        setStatus('จองสำเร็จ', 'success');
        showResult({
          eyebrow: 'Booking Confirmed',
          title: 'จองห้องประชุมสำเร็จ',
          message: `ระบบบันทึกรายการจอง ${formatDateTime(booking.startTime)} เรียบร้อยแล้ว`
        });
      }
    } catch (error) {
      setStatus(error.message, 'error');
      showResult({ eyebrow: 'Booking Error', title: 'จองไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      submitButton.disabled = false;
      submitButton.textContent = 'จองห้องประชุม';
    }
  });
