  adminLoginButton.addEventListener('click', async () => {
    adminLoginButton.disabled = true;
    diagnosticsResult.textContent = '';
    showLoading('กำลังเข้าสู่ระบบผู้ดูแล...');
    try {
      const session = await callApi('adminLogin', {
        username: adminUsername.value,
        password: adminPassword.value
      });
      setAdminLoggedIn(session);
      if (adminRememberMeToggle && adminRememberMeToggle.checked) {
        try {
          localStorage.setItem('admin_session', JSON.stringify({
            token: session.sessionToken,
            username: session.username,
            role: session.role
          }));
        } catch (e) {}
      } else {
        try { localStorage.removeItem('admin_session'); } catch (e) {}
      }
      adminPassword.value = '';
      showToast('เข้าสู่ระบบผู้ดูแลแล้ว', 'success');
      await loadAdminWorkspace();
      await refreshBookings();
    } catch (error) {
      showResult({ eyebrow: 'Admin Login', title: 'เข้าสู่ระบบไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      adminLoginButton.disabled = !!state.adminSessionToken;
    }
  });

  adminLogoutButton.addEventListener('click', () => {
    try { localStorage.removeItem('admin_session'); } catch (e) {}
    setAdminLoggedIn(null);
    adminRecentBookings.innerHTML = '<div class="empty">เข้าสู่ระบบเพื่อดู Dashboard</div>';
    adminBookingTableBody.innerHTML = '';
    adminRoomsGrid.innerHTML = '';
    adminAuditTableBody.innerHTML = '';
    diagnosticsResult.textContent = 'ยังไม่ได้รัน diagnostics';
    showToast('ออกจากระบบผู้ดูแลแล้ว', 'success');
  });

  adminDashboardButton.addEventListener('click', loadAdminDashboard);
  adminBookingsButton.addEventListener('click', loadAdminBookings);
  adminRoomsButton.addEventListener('click', loadAdminRooms);
  departmentAddButton.addEventListener('click', async () => {
    if (!state.adminSessionToken) return;
    const name = departmentNameInput.value.trim();
    if (await changeDepartments('adminAddDepartment', name, `เพิ่ม${departmentLabel(name)}แล้ว`)) departmentNameInput.value = '';
  });

  extraDepartmentList.addEventListener('click', async (event) => {
    const button = event.target.closest('.department-remove');
    if (!button || !state.adminSessionToken) return;
    const name = button.dataset.department;
    if (!window.confirm(`ลบ${departmentLabel(name)}ออกจากรายการ? (การจองเดิมและโฟลเดอร์ไฟล์บันทึกของฝ่ายนี้ยังอยู่)`)) return;
    await changeDepartments('adminRemoveDepartment', name, `ลบ${departmentLabel(name)}แล้ว`);
  });

  recordingsFolderSaveButton.addEventListener('click', async () => {
    if (!state.adminSessionToken) return;
    recordingsFolderSaveButton.disabled = true;
    showLoading('กำลังตรวจโฟลเดอร์...');
    try {
      const folder = await callApi('adminSetRecordingsFolder', { sessionToken: state.adminSessionToken, folder: recordingsFolderInput.value });
      renderRecordingsFolder(folder);
      await loadAdminAuditLogs();
      showToast('ตั้งโฟลเดอร์เก็บไฟล์บันทึกแล้ว', 'success');
    } catch (error) {
      recordingsFolderState.textContent = `ตั้งโฟลเดอร์ไม่สำเร็จ: ${error.message}`;
      recordingsFolderState.className = 'feature-settings-state is-error';
      showResult({ eyebrow: 'Recordings', title: 'ตั้งโฟลเดอร์ไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      recordingsFolderSaveButton.disabled = !state.adminSessionToken;
    }
  });
  adminAuditButton.addEventListener('click', loadAdminAuditLogs);
  adminFeatureSettingsSaveButton.addEventListener('click', async () => {
    if (!state.adminSessionToken) return;
    adminFeatureSettingsSaveButton.disabled = true;
    setFeatureSettingsState('กำลังบันทึกและตรวจค่าที่บันทึก...', '');
    showLoading('กำลังบันทึกการตั้งค่า...');
    try {
      const settings = await callApi('adminUpdateFeatureSettings', {
        sessionToken: state.adminSessionToken,
        emailNotificationsEnabled: emailNotificationsToggle.checked,
        meetOpenAccessEnabled: meetOpenAccessToggle.checked,
        meetAutoRecordingEnabled: meetAutoRecordingToggle.checked,
        meetCoHostsEnabled: meetCoHostsToggle.checked,
        meetRecordingsAdminOnly: meetRecordingsAdminOnlyToggle.checked,
        meetAutoEndEnabled: meetAutoEndToggle.checked,
        meetAutoEndMinutes: Number(meetAutoEndMinutesInput.value) || 10,
        maxMeetingAttendees: Number(maxMeetingAttendeesInput.value) || 24
      });
      renderFeatureSettings(settings || {});
      await loadAdminMeetAutoEndStatus();
      await loadAdminAuditLogs();
      setFeatureSettingsState(`บันทึกแล้ว ${formatDateTime(new Date().toISOString())}`, 'is-saved');
      showToast('บันทึกการตั้งค่าแล้ว', 'success');
      showResult({
        eyebrow: 'Feature Settings',
        title: 'บันทึกการตั้งค่าแล้ว',
        message: `อีเมลแจ้งเตือน: ${settings.emailNotificationsEnabled ? 'เปิด' : 'ปิด'}\nOpen access ของ Meet: ${settings.meetOpenAccessEnabled ? 'เปิด' : 'ปิด'}\nAuto-record ของ Meet: ${settings.meetAutoRecordingEnabled ? 'เปิด' : 'ปิด'}\nผู้ร่วมจัด (co-host): ${settings.meetCoHostsEnabled ? 'ผู้จองและผู้เข้าร่วมทุกคน' : 'ปิด'}\nไฟล์บันทึก: ${settings.meetRecordingsAdminOnly ? 'เฉพาะผู้ดูแล' : 'ตามที่ Google แชร์'}\nAuto End Meeting: ${settings.meetAutoEndEnabled ? 'เปิด (' + settings.meetAutoEndMinutes + ' นาที)' : 'ปิด'}\nผู้เข้าร่วมสูงสุดต่อการจอง: ${settings.maxMeetingAttendees} อีเมล`
      });
    } catch (error) {
      setFeatureSettingsState(`บันทึกไม่สำเร็จ: ${error.message}`, 'is-error');
      showResult({ eyebrow: 'Feature Settings', title: 'บันทึกการตั้งค่าไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      adminFeatureSettingsSaveButton.disabled = !state.adminSessionToken;
    }
  });

  adminRunAutoEndCheckButton.addEventListener('click', async () => {
    if (!state.adminSessionToken) return;
    adminRunAutoEndCheckButton.disabled = true;
    showLoading('กำลังตรวจสอบสถานะ Auto End Meeting ทั้งหมด...');
    try {
      const response = await callApi('adminRunAutoEndCheck', { sessionToken: state.adminSessionToken });
      renderMeetAutoEndStatus(response.status);
      await loadAdminAuditLogs();
      const result = response.result || {};
      const checked = result.checked || 0;
      const endedCount = (result.results || []).filter((r) => r.ok && r.result && r.result.action === 'conference_ended').length;
      showResult({
        eyebrow: 'Auto End Meeting',
        title: endedCount > 0 ? `ระบบจบห้องแล้ว ${endedCount} ห้อง` : 'ตรวจสอบสถานะเรียบร้อย',
        message: result.enabled === false
          ? 'ฟีเจอร์ Auto End Meeting ปิดอยู่ (ระบบไม่ได้จบห้องใดๆ)'
          : `ตรวจสอบ ${checked} รายการจองออนไลน์ที่กำลังประชุมอยู่\nห้องที่ถูกจบอัตโนมัติรอบนี้: ${endedCount} ห้อง`
      });
    } catch (error) {
      showResult({ eyebrow: 'Auto End Meeting', title: 'ตรวจสอบสถานะไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      adminRunAutoEndCheckButton.disabled = !state.adminSessionToken;
    }
  });

  adminMeetAuthorizationButton.addEventListener('click', async () => {
    if (!state.adminSessionToken) return;
    adminMeetAuthorizationButton.disabled = true;
    showLoading('กำลังตรวจสิทธิ์ Google Meet API...');
    try {
      const result = await callApi('adminMeetAuthorizationDiagnostics', { sessionToken: state.adminSessionToken });
      showResult({
        eyebrow: 'Google Meet API',
        title: result.meetSettingsGranted ? 'สิทธิ์ตั้งค่า Meet พร้อมใช้งาน' : 'ยังไม่ได้อนุญาตสิทธิ์ตั้งค่า Meet',
        message: `meetings.space.settings: ${result.meetSettingsGranted ? 'พร้อม' : 'ขาด'}\nmeetings.space.readonly: ${result.meetReadonlyGranted ? 'พร้อม' : 'ขาด'}\nmeetings.space.created: ${result.meetCreatedGranted ? 'พร้อม' : 'ขาด'}\nจำนวน OAuth scopes: ${result.scopeCount || 0}`
      });
    } catch (error) {
      showResult({ eyebrow: 'Google Meet API', title: 'ตรวจสิทธิ์ไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      adminMeetAuthorizationButton.disabled = !state.adminSessionToken;
    }
  });

  adminSyncMeetRecordingsButton.addEventListener('click', async () => {
    if (!state.adminSessionToken) return;
    adminSyncMeetRecordingsButton.disabled = true;
    showLoading('กำลังตรวจไฟล์บันทึก Google Meet...');
    try {
      const result = await callApi('adminSyncMeetRecordings', { sessionToken: state.adminSessionToken });
      const synced = (result.results || []).filter((item) => item.ok && item.result && item.result.synced).length;
      showResult({
        eyebrow: 'Google Meet Recording',
        title: synced ? 'จัดไฟล์บันทึกเรียบร้อย' : 'ยังไม่พบไฟล์บันทึกใหม่',
        message: `ตรวจ ${result.checked || 0} รายการ และจัดไฟล์สำเร็จ ${synced} รายการ${result.folderUrl ? `\nโฟลเดอร์: ${result.folderUrl}` : ''}`
      });
      await loadAdminAuditLogs();
    } catch (error) {
      showResult({ eyebrow: 'Google Meet Recording', title: 'ตรวจไฟล์บันทึกไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      adminSyncMeetRecordingsButton.disabled = !state.adminSessionToken;
    }
  });

  adminClearBookingDataButton.addEventListener('click', async () => {
    if (!state.adminSessionToken) return;
    const confirmed = window.confirm('ยืนยันล้างข้อมูลจองทั้งหมด? ระบบจะลบ bookings และ booking_index แต่ไม่ลบ admin, rooms, settings หรือ schema');
    if (!confirmed) return;
    adminClearBookingDataButton.disabled = true;
    showLoading('กำลังล้างข้อมูลจอง...');
    try {
      const result = await callApi('adminClearBookingData', { sessionToken: state.adminSessionToken });
      await refreshBookings();
      await loadAdminDashboard();
      await loadAdminBookings();
      await loadAdminAuditLogs();
      showResult({
        eyebrow: 'Maintenance',
        title: 'ล้างข้อมูลจองแล้ว',
        message: `ลบ bookings ${result.bookings || 0} รายการ และ booking_index ${result.bookingIndex || 0} รายการ`
      });
    } catch (error) {
      showResult({ eyebrow: 'Maintenance', title: 'ล้างข้อมูลจองไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      adminClearBookingDataButton.disabled = !state.adminSessionToken;
    }
  });

  // mode 'admin' edits any booking with the admin session; 'member' edits the member's own booking.
  function openAttendeeModal(bookingId, mode) {
    const source = mode === 'member' ? state.myBookings : state.adminBookings;
    const booking = source.find((item) => item.id === bookingId);
    if (!booking) return;
    state.attendeeModalBooking = booking;
    state.attendeeModalMode = mode === 'member' ? 'member' : 'admin';
    attendeeModalMeta.textContent = `${booking.title} · ${formatDateTime(booking.startTime)} - ${formatDateTime(booking.endTime)}`;
    const requesterName = booking.requesterName || (state.member ? memberDisplayName(state.member) : 'ผู้จอง');
    attendeeModalRequester.textContent = booking.requesterEmail
      ? `ผู้จอง ${requesterName} (${booking.requesterEmail}) เป็นผู้ร่วมจัดอัตโนมัติ`
      : `ผู้จอง ${requesterName} ไม่ได้กรอกอีเมล`;
    modalAttendees.set(parseAttendees(booking.attendeeEmails));
    attendeeModal.hidden = false;
    attendeeModalInput.focus();
  }

  function closeAttendeeModal() {
    attendeeModal.hidden = true;
    state.attendeeModalBooking = null;
  }

  async function saveAttendeeModal() {
    const booking = state.attendeeModalBooking;
    const asMember = state.attendeeModalMode === 'member';
    if (!booking || !(asMember ? state.memberToken : state.adminSessionToken)) return;
    const pending = modalAttendees.addFromInput();
    if (pending.invalid.length || pending.overLimit.length) return;
    if (!modalAttendees.get().length && !booking.requesterEmail) {
      attendeeModalError.textContent = 'กรุณาใส่อีเมลอย่างน้อย 1 คน (ใส่อีเมลตัวเองก็ได้) เพื่อให้มีคนเปิดห้องและอัดวิดีโอการประชุมได้';
      attendeeModalError.hidden = false;
      return;
    }
    attendeeModalSave.disabled = true;
    showLoading('กำลังบันทึกผู้ร่วมจัดและส่งคำเชิญ...');
    try {
      const result = asMember
        ? await callApi('memberUpdateAttendees', { memberToken: state.memberToken, bookingId: booking.id, attendeeEmails: modalAttendees.get() })
        : await callApi('adminUpdateAttendees', { sessionToken: state.adminSessionToken, bookingId: booking.id, attendeeEmails: modalAttendees.get() });
      closeAttendeeModal();
      if (asMember) {
        await loadMyBookings();
      } else {
        await loadAdminBookings();
        await refreshBookings();
        await loadAdminAuditLogs();
      }
      if (!result.added.length && !result.removed.length) {
        showToast('รายชื่อผู้ร่วมจัดไม่มีการเปลี่ยนแปลง', 'success');
        return;
      }
      showResult({
        eyebrow: 'Participants',
        title: 'บันทึกผู้ร่วมจัดแล้ว',
        message: [
          result.added.length ? `เพิ่ม ${result.added.length} คน: ${result.added.join(', ')}` : '',
          result.removed.length ? `ลบ ${result.removed.length} คน: ${result.removed.join(', ')}` : '',
          'Google Calendar ส่งคำเชิญและแจ้งการเปลี่ยนแปลงทางอีเมลแล้ว'
        ].filter(Boolean).join('\n')
      });
    } catch (error) {
      attendeeModalError.textContent = `บันทึกไม่สำเร็จ: ${error.message}`;
      attendeeModalError.hidden = false;
    } finally {
      hideLoading();
      attendeeModalSave.disabled = false;
    }
  }

  attendeeModalSave.addEventListener('click', saveAttendeeModal);
  attendeeModalCancel.addEventListener('click', closeAttendeeModal);
  attendeeModalClose.addEventListener('click', closeAttendeeModal);
  attendeeModal.addEventListener('click', (event) => {
    if (event.target === attendeeModal) closeAttendeeModal();
  });

  adminBookingTableBody.addEventListener('click', async (event) => {
    const attendeeButton = event.target.closest('.admin-edit-attendees');
    if (attendeeButton && state.adminSessionToken) {
      openAttendeeModal(attendeeButton.dataset.bookingId, 'admin');
      return;
    }
    const meetButton = event.target.closest('.admin-configure-meet');
    if (meetButton && state.adminSessionToken) {
      meetButton.disabled = true;
      showLoading('กำลังตั้งค่า Google Meet ให้เข้าได้ทันที...');
      try {
        const result = await callApi('adminConfigureMeetAccess', { sessionToken: state.adminSessionToken, bookingId: meetButton.dataset.bookingId });
        await loadAdminBookings();
        await loadAdminAuditLogs();
        const meetConfig = result.config || {};
        const meetDiagnostic = meetConfig.diagnostics || {};
        const patchDiagnostic = meetDiagnostic.patch || {};
        const verifiedDiagnostic = meetDiagnostic.verified || {};
        const diagnosticMessage = meetConfig.status === 'CONFIGURED'
          ? 'ผู้ที่มีลิงก์จะเข้าได้ทันที และ Google Meet พร้อมเริ่มบันทึกเมื่อ Host/Co-host เข้าห้อง'
          : `Google ไม่ยืนยันค่าที่ร้องขอ\nผล PATCH: Open=${patchDiagnostic.accessType || '-'}, Auto-record=${patchDiagnostic.autoRecording || '-'}\nผลตรวจซ้ำ: Open=${verifiedDiagnostic.accessType || '-'}, Auto-record=${verifiedDiagnostic.autoRecording || '-'}\nกรุณาส่งข้อความนี้ให้ผู้ดูแลตรวจสิทธิ์ Google Meet API และแพ็กเกจบัญชีอีกครั้ง`;
        showResult({
          eyebrow: 'Google Meet Access',
          title: meetConfig.status === 'CONFIGURED' ? 'ตั้งค่า Meet สำเร็จ' : 'Google Meet รับการตั้งค่าไม่ครบ',
          message: `Open access: ${meetConfig.accessType || 'ไม่ได้รับค่า'}\nAuto-record: ${meetConfig.autoRecording || 'ไม่ได้รับค่า'}\n${diagnosticMessage}`
        });
      } catch (error) {
        showResult({ eyebrow: 'Google Meet Access', title: 'ตั้งค่า Open ไม่สำเร็จ', message: error.message });
      } finally {
        hideLoading();
      }
      return;
    }
    const button = event.target.closest('.admin-cancel-booking');
    if (!button || !state.adminSessionToken) return;
    if (!window.confirm('ยืนยันยกเลิกรายการจองนี้?')) return;
    button.disabled = true;
    showLoading('กำลังยกเลิกรายการจอง...');
    try {
      await callApi('adminCancelBooking', { sessionToken: state.adminSessionToken, bookingId: button.dataset.bookingId });
      await refreshBookings();
      await loadAdminBookings();
      await loadAdminDashboard();
      await loadAdminAuditLogs();
      showToast('ยกเลิกรายการจองแล้ว', 'success');
    } catch (error) {
      showResult({ eyebrow: 'Cancel Booking', title: 'ยกเลิกรายการไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
    }
  });

  adminRoomsGrid.addEventListener('click', async (event) => {
    const button = event.target.closest('.admin-toggle-room');
    if (!button || !state.adminSessionToken) return;
    button.disabled = true;
    showLoading('กำลังอัปเดตทรัพยากร...');
    try {
      await callApi('adminToggleRoom', {
        sessionToken: state.adminSessionToken,
        roomId: button.dataset.roomId,
        active: button.dataset.active
      });
      const bootstrap = await callApi('bootstrap');
      state.rooms = bootstrap.rooms || [];
      renderRooms();
      await loadAdminRooms();
      await loadAdminDashboard();
      await loadAdminAuditLogs();
      showToast('อัปเดตทรัพยากรแล้ว', 'success');
    } catch (error) {
      showResult({ eyebrow: 'Resources', title: 'อัปเดตทรัพยากรไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
    }
  });

  diagnosticsButton.addEventListener('click', async () => {
    diagnosticsButton.disabled = true;
    diagnosticsResult.textContent = 'กำลังตรวจระบบ...';
    showLoading('กำลังตรวจระบบ...');
    try {
      const report = await callApi('diagnostics', { sessionToken: state.adminSessionToken });
      diagnosticsResult.textContent = JSON.stringify(report, null, 2);
      showToast(report.ok ? 'Diagnostics ผ่านแล้ว' : 'Diagnostics พบรายการที่ต้องตรวจต่อ', report.ok ? 'success' : 'error');
    } catch (error) {
      diagnosticsResult.textContent = error.message;
      showResult({ eyebrow: 'Diagnostics', title: 'ตรวจระบบไม่สำเร็จ', message: error.message });
    } finally {
      hideLoading();
      diagnosticsButton.disabled = !state.adminSessionToken;
    }
  });

  document.querySelectorAll('.tab-button').forEach((button) => {
    button.addEventListener('click', () => switchTab(button.dataset.tab));
  });

  document.querySelectorAll('[data-admin-switch-tab]').forEach((button) => {
    button.addEventListener('click', () => {
      switchTab(button.dataset.adminSwitchTab);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  document.querySelectorAll('input[name="meetingType"]').forEach((input) => {
    input.addEventListener('change', renderRooms);
  });

  document.querySelectorAll('[data-open-picker]').forEach((button) => {
    button.addEventListener('click', () => openDatePicker(button.dataset.openPicker));
  });

  document.querySelectorAll('.date-display').forEach((display) => {
    display.addEventListener('click', () => openDatePicker(display.dataset.dateDisplayFor));
  });

  document.querySelectorAll('.native-date-input').forEach((input) => {
    input.addEventListener('input', () => syncDateDisplay(input));
    input.addEventListener('change', () => syncDateDisplay(input));
  });

  [filterRoom, filterType, filterDepartment, filterFromDate, filterToDate, filterSearch].forEach((input) => {
    input.addEventListener('input', renderList);
    input.addEventListener('change', renderList);
  });

  [calendarFilterRoom, calendarFilterType, calendarFilterDepartment, calendarFilterFromDate, calendarFilterToDate, calendarFilterSearch].forEach((input) => {
    input.addEventListener('input', renderCalendar);
    input.addEventListener('change', renderCalendar);
  });

  resultCloseButton.addEventListener('click', hideResult);
  resultModal.addEventListener('click', (event) => {
    if (event.target === resultModal) hideResult();
  });

  datePickerPrev.addEventListener('click', () => {
    state.datePickerMonth = new Date(state.datePickerMonth.getFullYear(), state.datePickerMonth.getMonth() - 1, 1);
    renderDatePicker();
  });

  datePickerNext.addEventListener('click', () => {
    state.datePickerMonth = new Date(state.datePickerMonth.getFullYear(), state.datePickerMonth.getMonth() + 1, 1);
    renderDatePicker();
  });

  datePickerToday.addEventListener('click', () => {
    setDatePickerValue(new Date());
  });

  datePickerClear.addEventListener('click', () => {
    if (!state.activeDateInput) return;
    state.activeDateInput.value = '';
    syncDateDisplay(state.activeDateInput);
    state.activeDateInput.dispatchEvent(new Event('change', { bubbles: true }));
    closeDatePicker();
  });

  datePickerClose.addEventListener('click', closeDatePicker);

  datePickerGrid.addEventListener('click', (event) => {
    const button = event.target.closest('[data-date]');
    if (!button) return;
    const date = valueToDate(button.dataset.date);
    if (date) setDatePickerValue(date);
  });

  datePickerModal.addEventListener('click', (event) => {
    if (event.target === datePickerModal) closeDatePicker();
  });

  adminRecentBookings.innerHTML = '<div class="empty">เข้าสู่ระบบเพื่อดู Dashboard</div>';
  setAdminLoggedIn(null);
  load();
</script>
